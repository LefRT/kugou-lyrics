<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e9e2d5">
  <title>献给最亲爱的你</title>
  <script src="../journal-embed.js"></script>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="../journal-page.css">
  <script src="../首页左半部分/paper.js" defer></script>
  <script src="../flower-garden.js" defer></script>
  <script src="./garden.js" defer></script>
</head>
<body>
  <main class="desk">
    <article class="page" aria-label="手工书 · 扉页">
      <canvas class="garden-floor" width="1000" height="1250" aria-hidden="true"></canvas>
      <canvas class="garden-flowers" width="1000" height="1250" aria-hidden="true"></canvas>
      <section class="garden-lyrics" aria-label="当前片段的歌词" tabindex="0" hidden></section>
      <section class="garden-notes" aria-label="当前歌曲的留言" tabindex="0" hidden></section>

      <h1 class="dedication" aria-label="谨以此书献给最亲爱的你">
        <span class="line line-opening" aria-hidden="true">「谨</span>
        <span class="line line-book" aria-hidden="true">以此书</span>
        <span class="line line-offering" aria-hidden="true">献给</span>
        <span class="line line-recipient" aria-hidden="true">最亲爱的</span>
        <span class="line line-closing" aria-hidden="true">你」</span>
      </h1>

      <time class="date" datetime="2025">二零二五年</time>
    </article>
  </main>
