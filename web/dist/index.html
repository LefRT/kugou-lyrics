<script>
/* 首帧即读取舞台和控制台各自保存的主题。 */
(function () {
  try {
    var q = new URLSearchParams(location.search);
    var stage = !!(q.get('mashup') || q.get('song') || q.get('stage'));
    var night = localStorage.getItem('kg-theme') === 'night';
    document.documentElement.dataset.theme = night ? 'night' : 'day';
    if (stage) document.documentElement.dataset.stageTheme = night ? 'night' : 'day';
    document.documentElement.style.backgroundColor = stage ? (night ? '#112b85' : '#f3f2ea') : night ? 'var(--bg, #0c0c0e)' : 'var(--bg, #fff)';
  } catch (e) {
    document.documentElement.dataset.theme = 'day';
  }
})();
</script>
